services:
  hosted-agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: hosted-agent:latest
    ports:
      - "8080:8080"
    env_file:
      - .env        # copy .env.example → .env and fill in your values
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ENABLE_SWAGGER: "true"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
